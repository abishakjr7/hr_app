<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR RMS — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-glow: rgba(99,102,241,0.35);
            --accent: #a78bfa;
            --bg: #0b0f1a;
            --surface: #111827;
            --surface2: #1a2235;
            --border: rgba(255,255,255,0.08);
            --text: #f1f5f9;
            --muted: #94a3b8;
            --error: #f87171;
            --success: #34d399;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 20% 0%, rgba(99,102,241,0.15) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 80% 100%, rgba(167,139,250,0.12) 0%, transparent 60%);
            pointer-events: none;
        }

        /* Floating orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.18;
            animation: float 10s ease-in-out infinite;
            pointer-events: none;
        }
        .orb-1 { width: 400px; height: 400px; background: var(--primary); top: -100px; left: -100px; animation-delay: 0s; }
        .orb-2 { width: 300px; height: 300px; background: var(--accent); bottom: -80px; right: -80px; animation-delay: -4s; }
        .orb-3 { width: 200px; height: 200px; background: #06b6d4; top: 50%; left: 50%; animation-delay: -7s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-30px) scale(1.05); }
        }

        /* Grid dots background */
        .grid-bg {
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle, rgba(255,255,255,0.04) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
        }

        /* Login container */
        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            padding: 16px;
        }

        .login-card {
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 44px 40px;
            box-shadow:
                0 0 0 1px rgba(99,102,241,0.1),
                0 32px 80px rgba(0,0,0,0.5),
                0 0 60px rgba(99,102,241,0.08);
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Logo */
        .login-logo {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 32px;
        }

        .logo-mark {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #fff;
            box-shadow: 0 8px 24px var(--primary-glow);
            flex-shrink: 0;
        }

        .logo-text { display: flex; flex-direction: column; }
        .logo-title {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 22px;
            color: var(--text);
            letter-spacing: -0.5px;
            line-height: 1;
        }
        .logo-subtitle {
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin-top: 3px;
        }

        /* Heading */
        .login-heading { margin-bottom: 8px; }
        .login-heading h1 {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 26px;
            color: var(--text);
            letter-spacing: -0.5px;
        }
        .login-heading p {
            color: var(--muted);
            font-size: 14px;
            margin-top: 4px;
        }

        /* Divider */
        .divider {
            height: 1px;
            background: var(--border);
            margin: 24px 0;
        }

        /* Form */
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--muted);
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        .input-wrap {
            position: relative;
        }
        .input-wrap i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 14px;
            pointer-events: none;
            transition: color 0.2s;
        }
        .input-wrap input {
            width: 100%;
            padding: 13px 16px 13px 44px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 14.5px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }
        .input-wrap input::placeholder { color: rgba(148,163,184,0.5); }
        .input-wrap input:focus {
            border-color: var(--primary);
            background: rgba(99,102,241,0.06);
            box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
        }
        .input-wrap input:focus + i,
        .input-wrap:focus-within i { color: var(--accent); }

        .eye-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 14px;
            padding: 4px;
            transition: color 0.2s;
        }
        .eye-toggle:hover { color: var(--text); }

        /* Error alert */
        .alert-error {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(248,113,113,0.1);
            border: 1px solid rgba(248,113,113,0.25);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 18px;
            color: var(--error);
            font-size: 13.5px;
            animation: shakeX 0.4s ease;
        }
        @keyframes shakeX {
            0%, 100% { transform: translateX(0); }
            20%       { transform: translateX(-6px); }
            40%       { transform: translateX(6px); }
            60%       { transform: translateX(-4px); }
            80%       { transform: translateX(4px); }
        }

        /* Submit button */
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            margin-top: 6px;
            box-shadow: 0 8px 24px var(--primary-glow);
            transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            letter-spacing: 0.3px;
        }
        .btn-login:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
            box-shadow: 0 12px 32px var(--primary-glow);
        }
        .btn-login:active { transform: translateY(0); }
        .btn-login.loading { opacity: 0.75; pointer-events: none; }
        .btn-login .spin { animation: spin 0.8s linear infinite; display: none; }
        .btn-login.loading .spin { display: inline-block; }
        .btn-login.loading .btn-text { display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Footer hint */
        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: rgba(148,163,184,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .login-footer i { color: var(--primary); opacity: 0.7; }

        /* Role badge */
        .role-hint {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(99,102,241,0.08);
            border: 1px solid rgba(99,102,241,0.2);
            border-radius: 10px;
            padding: 10px 14px;
            margin-top: 18px;
            font-size: 12.5px;
            color: var(--accent);
        }
        .role-hint i { font-size: 13px; }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="login-wrapper">
        <div class="login-card">

            <!-- Logo -->
            <div class="login-logo">
                <div class="logo-mark">
                    <i class="fa-solid fa-layer-group"></i>
                </div>
                <div class="logo-text">
                    <span class="logo-title">HR RMS</span>
                    <span class="logo-subtitle">Resource Management System</span>
                </div>
            </div>

            <!-- Heading -->
            <div class="login-heading">
                <h1>Welcome back 👋</h1>
                <p>Sign in to access your HR dashboard</p>
            </div>

            <div class="divider"></div>

            <!-- Error Message -->
            {% if error %}
            <div class="alert-error">
                <i class="fa-solid fa-circle-exclamation"></i>
                {{ error }}
            </div>
            {% endif %}

            <!-- Login Form -->
            <form method="POST" action="/login" id="loginForm">
                <div class="form-group">
                    <label for="username">Email Address</label>
                    <div class="input-wrap">
                        <i class="fa-regular fa-envelope"></i>
                        <input
                            type="email"
                            id="username"
                            name="username"
                            placeholder="Enter your email"
                            value="{{ username or '' }}"
                            required
                            autocomplete="email"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-lock"></i>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                            autocomplete="current-password"
                        >
                        <button type="button" class="eye-toggle" id="eyeToggle" onclick="togglePassword()">
                            <i class="fa-regular fa-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <i class="fa-solid fa-spinner spin"></i>
                    <span class="btn-text"><i class="fa-solid fa-arrow-right-to-bracket"></i> &nbsp;Sign In</span>
                </button>
            </form>

            <div class="role-hint">
                <i class="fa-solid fa-shield-halved"></i>
                <span>Admin login grants full system access &bull; Employee login is view-only</span>
            </div>

            <div class="login-footer">
                <i class="fa-solid fa-lock"></i>
                Secured &bull; HR RMS &copy; 2025
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.className = 'fa-regular fa-eye-slash';
            } else {
                pwd.type = 'password';
                icon.className = 'fa-regular fa-eye';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', function() {
            const btn = document.getElementById('loginBtn');
            btn.classList.add('loading');
        });
    </script>
</body>
</html>
